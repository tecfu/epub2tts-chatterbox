[build-system]
requires = ["setuptools>=69.0.0,<72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epub2tts-chatterbox"
version = "1.2.2"
description = "Tool to read an epub to audiobook using chatterbox TTS"
authors = [
    {name = "Christopher Aedo", email = "c@aedo.dev"}
]
license = {text = "GPL 3.0"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "ebooklib>=0.19",
    "chatterbox-tts>=0.1.2",
    "lxml>=5.3.2",
    "mutagen>=1.47.0",
    "nltk>=3.9.1",
    "numpy>=1.24.0",
    "pillow>=11.2.1",
    "pydub>=0.25.1",
    "soundfile>=0.13.1",
    "tqdm>=4.67.1",
]

[project.scripts]
epub2tts-chatterbox = "epub2tts_chatterbox:main"

[project.urls]
Homepage = "https://github.com/tecfu/epub2tts-chatterbox"
